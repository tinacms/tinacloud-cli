name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1

      - name: fmt
        if: ${{ !cancelled() }}
        run: make fmt-ci

      - name: security
        if: ${{ !cancelled() }}
        run: make security

      - name: vet
        if: ${{ !cancelled() }}
        run: make vet

      - name: test
        if: ${{ !cancelled() }}
        run: make test

      - name: build
        if: ${{ !cancelled() }}
        run: make build-ci
